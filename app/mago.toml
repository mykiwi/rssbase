php-version = "8.6"

[source]
paths = ["bin/console", "config", "public", "src", "templates", "tests"]
includes = ["vendor"]
# reference.php: generated by Symfony when the container is rebuilt. bundles.php: rewritten by Symfony Flex on
# each package install, in its own format and without declare(strict_types=1).
excludes = ["config/bundles.php", "config/reference.php"]

# Any finding fails, down to notes: the project keeps zero findings.
[linter]
integrations = ["symfony", "phpunit", "doctrine"]
minimum-fail-level = "note"

[analyzer]
minimum-fail-level = "note"

[twig.linter]
minimum-fail-level = "note"
