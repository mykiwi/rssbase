php-version = "8.6"

[source]
paths = ["bin/console", "config", "public", "src", "templates", "tests"]
includes = ["vendor"]
# Generated by Symfony when the container is rebuilt.
excludes = ["config/reference.php"]

# Any finding fails, down to notes: the project keeps zero findings.
[linter]
integrations = ["symfony", "phpunit", "doctrine"]
minimum-fail-level = "note"
# Rewritten by Symfony Flex on each package install, which drops declare(strict_types=1).
excludes = ["config/bundles.php"]

[analyzer]
minimum-fail-level = "note"

[twig.linter]
minimum-fail-level = "note"
