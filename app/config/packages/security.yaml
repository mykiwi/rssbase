# yaml-language-server: $schema=../schema.json
security:
    providers:
        session:
            id: App\Security\SessionUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: session
            entry_point: App\Security\LoginEntryPoint
            custom_authenticators:
                - App\Security\AtProtoAuthenticator
            logout:
                path: /logout
                enable_csrf: true

    # Deny by default: a page added later is reserved unless it is listed here. Routing runs before the
    # firewall, so an unknown URL is still a 404.
    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/providers(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/oauth/callback$, roles: PUBLIC_ACCESS }
        - { path: ^/oauth-client-metadata\.json$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
