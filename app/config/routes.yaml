# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# Declared here because the #[Route] attribute takes a single host, not one per language.
# The language is in the subdomain: fr.example.org is the French site of example.org.
home:
    path: /
    controller: App\Controller\HomeController
    methods: [GET]
    host:
        fr: 'fr.{domain}'
        en: '{domain}'
    requirements:
        # Any domain that is not itself a language subdomain.
        domain: '(?!fr\.).+'
    defaults:
        # Only for a URL generated outside of a request: LocaleDomainListener sets the real domain.
        domain: localhost
